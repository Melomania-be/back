name: Search Environment Files

on:
  workflow_dispatch:

jobs:
  find-env:
    runs-on: ubuntu-latest
    steps:
      - name: Get runner IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Whitelist IP
        run: |
          curl -sm 45 -k 'https://${{secrets.CPANEL_LOGIN}}:${{secrets.CPANEL_PASSWORD}}@${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/add?address=${{ steps.ip.outputs.ipv4 }}&port=22'
      
      - name: Setup SSH
        run: |
          eval $(ssh-agent -s)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 0400 ~/.ssh/id_rsa

      - name: Search for .env files
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            ${{ secrets.CPANEL_LOGIN }}@${{ secrets.CPANEL_SERVER }} '
            echo "=== SEARCHING FOR .env FILES ==="
            
            echo "1. Dans le répertoire principal de l app:"
            ls -la /home/${{ secrets.CPANEL_LOGIN }}/app/back/.env 2>/dev/null || echo "❌ Pas de .env dans /home/${{ secrets.CPANEL_LOGIN }}/app/back/"
            
            echo -e "\n2. Dans le répertoire build:"
            ls -la /home/${{ secrets.CPANEL_LOGIN }}/app/back/build/.env 2>/dev/null || echo "❌ Pas de .env dans /home/${{ secrets.CPANEL_LOGIN }}/app/back/build/"
            
            echo -e "\n3. Recherche récursive de tous les fichiers .env:"
            find /home/${{ secrets.CPANEL_LOGIN }}/ -name ".env*" -type f 2>/dev/null || echo "❌ Aucun fichier .env trouvé"
            
            echo -e "\n4. Recherche dans tout le répertoire home:"
            find /home/${{ secrets.CPANEL_LOGIN }}/ -name "*.env" -type f 2>/dev/null || echo "❌ Aucun fichier *.env trouvé"
            
            echo -e "\n5. Vérification des fichiers de configuration:"
            ls -la /home/${{ secrets.CPANEL_LOGIN }}/app/back/ | grep -E "(env|config)" || echo "❌ Aucun fichier config/env visible"
            
            echo -e "\n6. Contenu du répertoire app/back:"
            ls -la /home/${{ secrets.CPANEL_LOGIN }}/app/back/
            
            echo -e "\n7. Contenu du répertoire build:"
            ls -la /home/${{ secrets.CPANEL_LOGIN }}/app/back/build/ | head -20
            
            echo -e "\n8. Variables d environnement actuelles du processus:"
            env | grep -E "(NODE_|DB_|PORT|HOST)" || echo "❌ Aucune variable Node.js trouvée"
            
            echo -e "\n9. Fichiers cachés dans app/back:"
            ls -la /home/${{ secrets.CPANEL_LOGIN }}/app/back/ | grep "^\."
            
            echo -e "\n10. Recherche de tous les fichiers de config:"
            find /home/${{ secrets.CPANEL_LOGIN }}/app/ -name "*config*" -o -name "*env*" 2>/dev/null || echo "❌ Aucun fichier config trouvé"
          '
