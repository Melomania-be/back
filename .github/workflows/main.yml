name: Debug Server 500 Error

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Get runner IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Whitelist IP
        run: |
          curl -sm 45 -k 'https://${{secrets.CPANEL_LOGIN}}:${{secrets.CPANEL_PASSWORD}}@${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/add?address=${{ steps.ip.outputs.ipv4 }}&port=22'
      
      - name: Setup SSH
        run: |
          eval $(ssh-agent -s)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 0400 ~/.ssh/id_rsa

      - name: Diagnose Server Issues
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            ${{ secrets.CPANEL_LOGIN }}@${{ secrets.CPANEL_SERVER }} '
            echo "=== APPLICATION STATUS ==="
            /usr/sbin/cloudlinux-selector status --json --interpreter nodejs --user ${{ secrets.CPANEL_LOGIN }} --app-root app/back
            
            echo -e "\n=== DISK SPACE ==="
            df -h /home/${{ secrets.CPANEL_LOGIN }}/
            
            echo -e "\n=== APP DIRECTORY ==="
            ls -la /home/${{ secrets.CPANEL_LOGIN }}/app/back/
            
            echo -e "\n=== ENVIRONMENT FILE ==="
            ls -la /home/${{ secrets.CPANEL_LOGIN }}/app/back/.env || echo "No .env file found"
            
            echo -e "\n=== RECENT LOGS ==="
            cd /home/${{ secrets.CPANEL_LOGIN }}/app/back
            find . -name "*.log" -type f -exec echo "=== {} ===" \; -exec tail -20 {} \; 2>/dev/null || echo "No log files found"
            
            echo -e "\n=== NODE MODULES ==="
            ls -la /home/${{ secrets.CPANEL_LOGIN }}/app/back/node_modules/ | head -10 || echo "No node_modules"
            
            echo -e "\n=== PACKAGE.JSON ==="
            cat /home/${{ secrets.CPANEL_LOGIN }}/app/back/package.json | grep -A5 -B5 "scripts" || echo "No package.json"
            
            echo -e "\n=== APP PROCESS ==="
            ps aux | grep node || echo "No node processes running"
            
            echo -e "\n=== TESTING API ENDPOINT ==="
            curl -X POST http://localhost:3333/api/sign_in \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"test@test.com\",\"password\":\"test\"}" \
              -w "\nHTTP Status: %{http_code}\n" || echo "Curl failed"
          '

      - name: Check Database Connection
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            ${{ secrets.CPANEL_LOGIN }}@${{ secrets.CPANEL_SERVER }} '
            cd /home/${{ secrets.CPANEL_LOGIN }}/app/back
            echo "=== DATABASE STATUS ==="
            if [ -f ".env" ]; then
              echo "Environment file exists"
              grep -E "^DB_|^DATABASE_" .env || echo "No DB config found in .env"
            else
              echo "No .env file found"
            fi
            
            echo -e "\n=== TRYING TO CONNECT TO DB ==="
            timeout 10 node -e "
              try {
                console.log(\"Testing database connection...\");
                // Add your DB test here if needed
              } catch(e) {
                console.error(\"DB Test failed:\", e.message);
              }
            " || echo "Node test failed"
          '
